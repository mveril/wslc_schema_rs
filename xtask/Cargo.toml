[package]
name = "xtask"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
hex = { workspace = true }
git2 = { version = "0.21", default-features = false, features = ["https"] }
prettyplease = "0.3"
proc-macro2 = "1.0"
# typify 0.7 exposes schemars 0.8 types in its public API.
schemars = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { version = "3.0", features = ["full"] }
tempfile = "3.22"
tree-sitter = "0.27"
tree-sitter-cpp = "0.23"
typify = "0.7"
